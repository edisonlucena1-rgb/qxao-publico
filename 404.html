<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Qxao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', system-ui, sans-serif; background:#ffffff; color:#1f2937; }
        h1 { font-family: 'Montserrat', sans-serif; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/assets/qxao-logo.svg">
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
    <a href="/" class="block w-40 mb-6" aria-label="Qxao - Inicio"><img src="/assets/qxao-logo.svg" alt="Qxao" class="w-full h-auto"></a>
    <main class="max-w-md text-center">
        <img src="/assets/404-qxao.svg" alt="" class="w-56 max-w-full mx-auto mb-4">
        <p class="text-[#690991] font-bold text-sm tracking-widest">ERROR 404</p>
        <h1 class="text-3xl font-bold text-[#690991] mt-2 mb-4">Página no encontrada</h1>
        <p class="text-gray-600 mb-8">La dirección que buscas no existe o cambió de lugar. Puedes volver al inicio o revisar nuestros planes.</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="px-6 py-3 rounded-full bg-[#690991] text-white font-bold hover:bg-[#4a0066] transition">Volver al inicio</a>
            <a href="/planes/" class="px-6 py-3 rounded-full border-2 border-[#690991] text-[#690991] font-bold hover:bg-[#690991]/5 transition">Ver planes</a>
        </div>
    </main>
</body>
</html>
