                <p class="text-xs md:text-sm text-gray-400">Despliegue de Agente IA</p>
            </div>
            <span id="statusBadge" class="bg-red-900/40 text-red-400 border border-red-800/50 px-3 py-1 rounded-md text-[10px] md:text-xs font-bold tracking-widest uppercase transition-colors duration-300">

        <!-- Área Central del QR -->

            <h3 id="instructionText" class="text-qxaoGlow font-semibold text-center mb-6 text-sm md:text-base">
                Sincroniza tu línea de atención comercial con la infraestructura Qxao
            </h3>

            <!-- Loader (Oculto por defecto) -->
            <div id="loading" class="hidden flex-col items-center">
                <div class="loader mb-4"></div>
                <p class="text-sm text-gray-400 font-mono tracking-wide animate-pulse">Solicitando token cifrado desde n8n...</p>
            </div>

            <!-- Contenedor de Imagen QR -->
            <div id="qrContainer" class="bg-white p-3.5 rounded-xl hidden shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                <img id="imagen-qr" src="" alt="Código QR Qxao" class="w-52 h-52 object-contain">
            </div>

        </div>

        <!-- Botón de Acción -->
        <button id="getQrBtn" onclick="generarQR()" class="w-full bg-primary hover:bg-[#4a0066] text-white font-bold py-4 px-8 rounded-full transition-all duration-300 shadow-[0_0_20px_rgba(105,9,145,0.4)] hover:shadow-[0_0_30px_rgba(197,131,240,0.6)] hover:-translate-y-1">
            Generar Código QR

        <p class="text-[10px] text-gray-500 mt-6 text-center tracking-wide uppercase">
            Protegido por Arquitectura Anti-Alucinaciones Qxao
        </p>
    </div>

    <!-- EL SCRIPT MÁGICO COMPLETAMENTE INTEGRADO -->
    <script>
        function generarQR() {
            // URL exacta de tu webhook en n8n
            const webhookUrl = "https://agentes-qxao-n8n.jhf0s9.easypanel.host/webhook/obtener-qr-engranos";

            // Elementos visuales
            const btn = document.getElementById('getQrBtn');
            const loading = document.getElementById('loading');
            const qrContainer = document.getElementById('qrContainer');
            const instructionText = document.getElementById('instructionText');
            const statusBadge = document.getElementById('statusBadge');
            const img = document.getElementById("imagen-qr");

            // Animación de interfaz (Cargando)
            btn.classList.add('hidden');
            qrContainer.classList.add('hidden');
            instructionText.classList.add('hidden');
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            console.log("Solicitando QR...");

            // Llamamos a n8n
            fetch(webhookUrl)
                .then(response => response.json()) // Leemos la respuesta JSON
                .then(data => {
                    // Si n8n responde con éxito, dibujamos la imagen
                    if(data.status === "success") {
                        // Inyectamos el código Base64 directamente al src de la imagen
                        img.src = data.qr_base64;
                        
                        // Actualizamos la interfaz
                        loading.classList.add('hidden');
                        loading.classList.remove('flex');
                        qrContainer.classList.remove('hidden');
                        
                        // Cambiamos el texto del botón y lo mostramos de nuevo
                        btn.textContent = 'Actualizar Código QR';
                        btn.classList.remove('hidden');

                        // Opcional: Cambiar estado a pendiente de escaneo
                        statusBadge.textContent = 'Escaneo Pendiente';
                        statusBadge.className = 'bg-yellow-900/40 text-yellow-400 border border-yellow-800/50 px-3 py-1 rounded-md text-[10px] md:text-xs font-bold tracking-widest uppercase transition-colors duration-300';
                    } else {
                        throw new Error("El JSON no trajo el status success");
                    }
                })
                .catch(error => {
                    alert("Hubo un error al generar el QR. Intente de nuevo.");
                    console.error(error);
                    
                    // Restauramos la interfaz
                    loading.classList.add('hidden');
                    loading.classList.remove('flex');
                    instructionText.classList.remove('hidden');
                    btn.classList.remove('hidden');
                });
        }
    </script>
